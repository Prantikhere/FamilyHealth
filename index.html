<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#C85A32" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FamilyHealth" />
    <meta name="description" content="African Family Health Platform: Multi-generational health circle, dual-tier official hospital records, air-gapped emergency ICE QR pass, and vernacular care triage." />
    <title>FamilyHealth — African Family Health Platform</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swPath = (window.location.pathname.startsWith('/FamilyHealth') ? '/FamilyHealth/' : '/') + 'sw.js';
          navigator.serviceWorker.register(swPath).catch(err => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </head>
  <body class="bg-canvas text-charcoal antialiased selection:bg-terracotta-container selection:text-terracotta overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
